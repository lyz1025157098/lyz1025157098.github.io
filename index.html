<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>我的DeepSeek AI助手</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #f5f5f7;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .header {
            background: white;
            padding: 15px 20px;
            text-align: center;
            font-weight: 600;
            font-size: 1.2rem;
            border-bottom: 1px solid #e9e9ef;
            color: #1c1c1e;
        }
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .message {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 22px;
            line-height: 1.45;
            font-size: 16px;
            word-wrap: break-word;
        }
        .user-message {
            align-self: flex-end;
            background-color: #007aff;
            color: white;
            border-bottom-right-radius: 5px;
        }
        .ai-message {
            align-self: flex-start;
            background-color: #e5e5ea;
            color: #000;
            border-bottom-left-radius: 5px;
        }
        .input-area {
            background: white;
            padding: 12px 16px;
            border-top: 1px solid #e9e9ef;
            display: flex;
            gap: 12px;
            align-items: center;
        }
        textarea {
            flex: 1;
            border: 1px solid #d1d1d6;
            border-radius: 20px;
            padding: 10px 16px;
            font-size: 16px;
            font-family: inherit;
            resize: none;
            outline: none;
            background: #f9f9fb;
            max-height: 100px;
        }
        button {
            background-color: #007aff;
            border: none;
            color: white;
            width: 44px;
            height: 44px;
            border-radius: 30px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        button:active { transform: scale(0.96); background-color: #005fc1; }
        button:disabled { background-color: #b0b0b8; }
        .loading { text-align: center; color: gray; font-size: 14px; padding: 10px; }
    </style>
</head>
<body>

    <div class="header">🤖 DeepSeek AI 助手</div>
    
    <div class="messages" id="message-container">
        <div class="message ai-message">你好！我是DeepSeek，有什么可以帮你的吗？</div>
    </div>
    
    <div class="input-area">
        <textarea id="user-input" placeholder="输入你的问题..." rows="1"></textarea>
        <button id="send-btn">➤</button>
    </div>

    <script>
                      
               const API_URL = 'https://deepseek-proxy.1025157098.workers.dev/';
        function getAccessToken() {
            let t = localStorage.getItem("ds_access_token");
            if (!t) {
                t = prompt("请输入访问口令");
                if (t) localStorage.setItem("ds_access_token", t);
            }
            return t;
        }
        const messageContainer = document.getElementById('message-container');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        
        let conversationHistory = [
            { role: "system", content: "你是一个乐于助人的AI助手，请用中文回答，回答要简洁准确。" }
        ];

        function addMessage(content, isUser) {
            const messageDiv = document.createElement('div');
            messageDiv.classList.add('message', isUser ? 'user-message' : 'ai-message');
            messageDiv.innerText = content;
            messageContainer.appendChild(messageDiv);
            messageContainer.scrollTop = messageContainer.scrollHeight;
            return messageDiv;
        }

        function showLoading() {
            const loadingDiv = document.createElement('div');
            loadingDiv.id = 'loading-indicator';
            loadingDiv.classList.add('loading');
            loadingDiv.innerText = 'AI正在思考...';
            messageContainer.appendChild(loadingDiv);
            messageContainer.scrollTop = messageContainer.scrollHeight;
        }
        
        function hideLoading() {
            const loader = document.getElementById('loading-indicator');
            if(loader) loader.remove();
        }

        async function callDeepSeek(userMessage) {
            conversationHistory.push({ role: "user", content: userMessage });
            addMessage(userMessage, true);
            
            const requestBody = {
                model: "deepseek-chat",
                messages: conversationHistory,
                temperature: 0.7,
                max_tokens: 2000,
                stream: false
            };

            showLoading();
            sendBtn.disabled = true;

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                                           "X-Access-Token": getAccessToken()
                    },
                    body: JSON.stringify(requestBody)
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error?.message || `请求失败，状态码：${response.status}`);
                }

                const data = await response.json();
                const assistantReply = data.choices[0].message.content;
                conversationHistory.push({ role: "assistant", content: assistantReply });
                addMessage(assistantReply, false);
                
            } catch (error) {
                console.error('API调用出错:', error);
                addMessage(`出错了：${error.message}。请检查API Key或网络。`, false);
            } finally {
                hideLoading();
                sendBtn.disabled = false;
                userInput.focus();
            }
        }

        function handleSend() {
            const text = userInput.value.trim();
            if (!text) return;
                                                                userInput.value = '';
            userInput.style.height = 'auto';
            callDeepSeek(text);
        }

        sendBtn.addEventListener('click', handleSend);
        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                handleSend();
            }
        });
        userInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 100) + 'px';
        });
    </script>
</body>
</html>
